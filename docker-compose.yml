version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mcp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  node-mcp-server:
    build: .
    container_name: mcp_node_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SEED_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mcp_db"
      DATABASE_URL: "postgresql://mcp_user:postgres@postgres:5432/mcp_db"
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true

volumes:
  pgdata:
